name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "artifacts/baseline/**"
      - "data/observations.jsonl"
      - "src/energy_prediction/dashboard.py"
      - "src/models/baseline/**"
      - "src/training/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
      - name: Install project dependencies
        run: uv sync --frozen
      - name: Generate dashboard data from trained models
        run: uv run --frozen --no-sync python -m energy_prediction.dashboard
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
